# Portlin's TLP settings, read only once the ThinkPad entry in Drivers has
# installed TLP. Edit or remove this file to change them; an upgrade leaves
# an edited copy alone.

# The system runs from a USB drive. TLP would otherwise let the kernel
# suspend idle USB devices, that drive among them, and a cheap stick that
# does not wake cleanly takes the root filesystem with it.
USB_AUTOSUSPEND=0
