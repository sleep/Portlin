# Generated by portlin.
[greeter]
theme-name=Numix
icon-theme-name=Papirus-Dark
# The wallpaper rather than flat ink, so the mark is on screen from the login
# prompt onward. An absolute path because the greeter runs before any session
# exists: it has no XDG_CONFIG_DIRS, no xfconf and no user to read a setting
# from. This render is the one xfdesktop falls back to as well -- one size has
# to stand in for every panel, and the greeter knows no more than xfdesktop
# does about what the stick was plugged into.
background=/usr/share/backgrounds/portlin/portlin-1920x1080.png
