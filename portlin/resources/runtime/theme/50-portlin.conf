# Generated by portlin.
[greeter]
theme-name=Numix
icon-theme-name=Papirus-Dark
# The wallpaper rather than flat ink, so the mark is on screen from the login
# prompt onward. An absolute path because the greeter runs before any session
# exists: it has no XDG_CONFIG_DIRS, no xfconf and no user to read a setting
# from. It is the path xfdesktop falls back to as well, which portlin-backdrop
# points at the render that is true of this stick -- root crimson only when it
# is encrypted -- before the greeter starts.
background=/usr/share/backgrounds/xfce/xfce-x.svg
